name: "Relato de uso clínico"
description: "Conte como o app se comportou no uso real — bom ou ruim."
labels: ["área: conteúdo"]
body:
  - type: markdown
    attributes:
      value: |
        **Relato livre.** Não há formato certo: conte sua experiência de uso na UTI.
        Relatos de uso real orientam quais ferramentas merecem prioridade.
        Se preferir conversar sem abrir uma issue, use as
        [Discussions](https://github.com/p-ofjardim/uti-toolkit-mjardim/discussions).
  - type: textarea
    id: relato
    attributes:
      label: "Seu relato"
      placeholder: "Como você usou, o que funcionou, o que atrapalhou..."
    validations:
      required: true
